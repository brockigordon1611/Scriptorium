  <!-- Bundled Cinzel / Cormorant Garamond. Relative on purpose: resolves under
       both the native build (/) and GitHub Pages (/Scriptorium/). -->
  <!-- Loaded without blocking the first paint. A plain stylesheet link holds the
       whole page back until it is fetched and parsed, which is what left the boot
       screen below staring at black. The faces already use font-display:swap, so
       text shows in Georgia for an instant and then settles into Cinzel. -->
  <link rel="stylesheet" href="fonts/fonts.css" media="print" onload="this.media='all';this.onload=null">
  <noscript><link rel="stylesheet" href="fonts/fonts.css"></noscript>

  <style>
    html,body{margin:0;padding:0;background:#0e0d0b;overflow:hidden;height:100%;overscroll-behavior:none;}
    #root{height:100%;display:flex;flex-direction:column;overflow:hidden;}
    /* Safe-area-inset-top CSS variable — refined by JS below */
    :root{--sat:env(safe-area-inset-top,0px);}
  </style>
  <script>
    /* Detect iPad and set a minimum safe-area floor before React renders. */
    (function(){
      var isIPad=/iPad/.test(navigator.userAgent)||(navigator.maxTouchPoints>2&&/Mac/.test(navigator.userAgent));
      /* Use screen height to distinguish large iPads (Pro 13") from smaller ones (Air 11").
         iPad Pro 13" logical portrait height ~1376pt; iPad Air 11" ~1180pt.
         Large iPad iOS 26 status bar ~130-140px; small iPad ~70-80px. */
      /* sat-min is a safety floor only — used when env() returns 0 inside Capacitor native builds.
         In a web browser or PWA, env(safe-area-inset-top) works correctly so no floor is needed.
         iPad Pro 13" (logicalHeight>1250) may have env()=0 in this Capacitor build, needs ~150px.
         Other native devices: a 20px floor is enough. Web/PWA: 0px (env() is reliable). */
      var isNative=!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());
      var satMin='0px';
      if(isNative){
        satMin='20px';
        if(isIPad){var longDim=Math.max(screen.width,screen.height);satMin=longDim>1250?'150px':'20px';}
      }
      document.documentElement.style.setProperty('--sat-min',satMin);

      /* Also try to measure env(safe-area-inset-top) directly and set --sat */
      var probe=null;
      function apply(){
        if(!document.body)return;
        if(!probe){probe=document.createElement('div');probe.style.cssText='position:fixed;top:env(safe-area-inset-top,0px);left:0;width:0;height:0;visibility:hidden;pointer-events:none;';document.body.appendChild(probe);}
        var v=probe.getBoundingClientRect().top;
        if(v>10)document.documentElement.style.setProperty('--sat',v+'px');
      }
      function init(){apply();requestAnimationFrame(function(){requestAnimationFrame(apply);});setTimeout(apply,300);setTimeout(apply,1000);setTimeout(apply,3000);}
      if(document.body){init();}else{document.addEventListener('DOMContentLoaded',init);}
      window.addEventListener('resize',apply);
      window.addEventListener('orientationchange',function(){setTimeout(apply,300);});
    })();
  </script>
</head>
<body>
  <!-- Painted straight from the HTML so the first frame is the app's own screen.
       The gap before this was pure black: the bundle has to load and parse before
       React can render anything, so no React-side loading screen can cover it.
       React replaces all of this the moment it mounts. -->
  <div id="root">
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:#0e0d0b;text-align:center;padding:0 24px;box-sizing:border-box">
      <div style="font-family:Cinzel,Georgia,serif;font-size:28px;font-weight:700;color:#e4cc78;letter-spacing:0.08em;margin-bottom:8px">Scriptorium</div>
      <div style="font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:14px;color:#8a7a48;line-height:1.7;margin-bottom:24px">"The words of the LORD are pure words: as silver tried<br>in a furnace of earth, purified seven times." &mdash; Psalm 12:6</div>
      <div style="width:160px;height:2px;overflow:hidden;background:#28251e;border-radius:1px;margin-bottom:14px">
        <div style="width:100%;height:100%;background:linear-gradient(90deg,transparent,#c8a84e,transparent);background-size:200% 100%;animation:bootLine 1.5s ease-in-out infinite"></div>
      </div>
      <div style="font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:15px;color:#8a7a48">Loading&hellip;</div>
    </div>
  </div>
  <style>@keyframes bootLine{0%{background-position:200% 0}100%{background-position:-200% 0}}</style>
  <script>
    /* The native splash is torn down on a timer that knows nothing about the
       WebView, so whatever sits between the two — black — shows through until
       this screen paints. Hide it the moment the boot screen is on the glass
       instead. Hiding early is always allowed, so this only ever shortens the
       splash; launchAutoHide stays on as the backstop, and a JS failure here
       can strand nobody. */
    (function(){
      var done=false;
      window.__hideSplash=function(){
        if(done)return;
        try{
          var C=window.Capacitor,p=C&&C.Plugins&&C.Plugins.SplashScreen;
          /* Only count it as done once the call actually went out, or a bridge
             that was not ready yet would silently cancel the retry below. */
          if(p&&p.hide){p.hide({fadeOutDuration:250});done=true;}
        }catch(e){}
      };
      requestAnimationFrame(function(){requestAnimationFrame(window.__hideSplash);});
    })();
  </script>
  <script>
    var _startupErrorShown = false;
    window.addEventListener('error', function(e) {
      var root = document.getElementById('root');
      if (root && root.children.length > 0) return;
      if (!e.message || (e.lineno === 0 && e.colno === 0)) return;
      if (_startupErrorShown) return;
      _startupErrorShown = true;
      root.innerHTML =
        '<div style="font-family:monospace;color:#e05555;padding:32px;background:#0e0d0b;min-height:100vh">' +
        '<div style="font-size:18px;margin-bottom:16px">&#9888; Startup Error</div>' +
        '<div style="font-size:13px;color:#c09090;white-space:pre-wrap">' +
        (e.message||'') + '\n\nLine: ' + e.lineno + '  Col: ' + e.colno +
        '</div></div>';
    });
    window.addEventListener('unhandledrejection', function(e) {
      e.preventDefault();
    });
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>
