name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - name: Build
        run: npm run build
        env:
          VITE_SUPA_URL: ${{ secrets.VITE_SUPA_URL }}
          VITE_SUPA_ANON: ${{ secrets.VITE_SUPA_ANON }}
          GITHUB_PAGES: true

      - name: Copy docs pages into build
        run: cp docs/privacy.html dist/privacy.html && cp docs/support.html dist/support.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@v4
